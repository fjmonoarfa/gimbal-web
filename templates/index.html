<!DOCTYPE html>
<html lang="id" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPAB GIMBAL - Generasi Indonesia Menyatu Bersama Alam</title>
    <link rel="icon" href="/assets/logo.png" type="image/png">

    <!-- Central Theme & Site Width Configuration -->
    <link rel="stylesheet" href="/static/css/theme.css?v=20261003_1">
    <script>
        window.GIMBAL_SERVER_THEME = "{{ server_theme_color or 'orange' }}";
        window.GIMBAL_SERVER_WIDTH = "{{ server_site_width or '85%' }}";
    </script>
    <script src="/static/js/theme-config.js?v=20261003_1"></script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://unpkg.com/feather-icons"></script>

    <!-- HTMX (Local Vendor with onerror Fallback) -->
    <script src="/static/vendor/htmx/htmx.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/htmx.org@1.9.12'"></script>

    <!-- Alpine.js (Local Vendor with dynamic Fallback) -->
    <script defer src="/static/vendor/alpine/alpine.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.defer=true;s.src='https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js';document.head.appendChild(s);"></script>

    <!-- Google Identity Services (GIS) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Global HTMX + Alpine.js Lifecycle Integration -->
    <script>
        function initAlpineTreeSafely(el) {
            if (window.Alpine && typeof window.Alpine.initTree === 'function') {
                try {
                    window.Alpine.initTree(el || document.body);
                } catch (e) {
                    console.warn('Alpine.initTree notice:', e);
                }
            }
        }
        document.addEventListener('htmx:load', function(evt) {
            initAlpineTreeSafely(evt.detail && evt.detail.elt);
        });
        document.addEventListener('htmx:afterSwap', function(evt) {
            initAlpineTreeSafely(evt.detail && evt.detail.target);
        });
        document.addEventListener('alpine:init', function() {
            setTimeout(function() { initAlpineTreeSafely(document.body); }, 50);
        });
        document.addEventListener('alpine:initialized', function() {
            setTimeout(function() { initAlpineTreeSafely(document.body); }, 50);
        });
        window.addEventListener('load', function() {
            setTimeout(function() { initAlpineTreeSafely(document.body); }, 100);
        });
    </script>

    <!-- FontAwesome 6 Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Google Fonts: Poppins & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Custom Theme & HTMX Global Styles -->
    <style>
        html {
            scroll-behavior: smooth;
            scroll-padding-top: 5rem;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        h1, h2, h3, .font-heading {
            font-family: 'Poppins', sans-serif;
        }
        [x-cloak] {
            display: none !important;
        }
        .htmx-indicator {
            display: none;
        }
        .htmx-request .htmx-indicator,
        .htmx-request.htmx-indicator {
            display: inline-block;
        }
        /* Custom sleek scrollbar */
        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        .adventure-gradient {
            background: var(--brand-600, #ea580c);
        }
        .gimbal-orange {
            color: var(--brand-600, #ea580c);
        }
        .bg-gimbal-orange {
            background-color: var(--brand-600, #ea580c);
        }
        .kta-card {
            background: var(--brand-600, #ea580c);
            background-color: var(--brand-600, #ea580c);
            box-shadow: 0 10px 25px -5px rgba(var(--brand-600-rgb, 234, 88, 12), 0.35);
        }
    </style>
</head>

<body class="bg-slate-50 font-sans flex flex-col min-h-screen text-slate-800 antialiased selection:bg-orange-600 selection:text-white">

    <!-- Global Top Loading Progress Bar -->
    <div id="global-indicator" class="htmx-indicator fixed top-0 left-0 w-full h-1.5 bg-gradient-to-r from-orange-600 via-orange-500 to-amber-500 z-[9999] transition-all duration-300">
        <div class="h-full bg-white/40 animate-pulse"></div>
    </div>

    <!-- LAYER 1: Shell Frame Loader (hx-get loads shell.html into app-shell) -->
    <div id="app-shell" hx-get="{{ shell_url or '/app-shell' }}" hx-trigger="load" hx-swap="innerHTML">
        <!-- Initial skeleton while Layer 2 shell loads -->
        <div class="min-h-screen flex items-center justify-center bg-slate-900 text-white">
            <div class="text-center space-y-4">
                <div class="inline-block w-16 h-16 border-4 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
                <h2 class="text-xl font-bold tracking-wide font-heading">KPAB GIMBAL</h2>
                <p class="text-sm text-orange-400 animate-pulse">Generasi Indonesia Menyatu Bersama Alam</p>
            </div>
        </div>
    </div>

    <!-- Safety Net Failsafe & Error Handler for Network / Server latency -->
    <script>
        (function() {
            var shell = document.getElementById('app-shell');
            var retryUrl = "{{ shell_url or '/app-shell' }}";

            // Tangani error respons server (misal HTTP 500 / 404)
            document.body.addEventListener('htmx:responseError', function(evt) {
                if (shell && evt.detail && evt.detail.target === shell) {
                    var status = evt.detail.xhr ? evt.detail.xhr.status : 'Error';
                    shell.innerHTML = '<div class="min-h-screen flex items-center justify-center bg-slate-900 text-white p-6 text-center">' +
                        '<div class="space-y-4 max-w-md bg-slate-800/90 p-8 rounded-xl border border-rose-500/40 shadow-2xl">' +
                        '<div class="w-12 h-12 rounded-2xl bg-rose-500/20 text-rose-400 flex items-center justify-center mx-auto text-xl"><i class="fas fa-exclamation-triangle"></i></div>' +
                        '<h2 class="text-base font-bold font-heading">Terjadi Kendala Memuat Halaman</h2>' +
                        '<p class="text-xs text-slate-300">Server mengembalikan status ' + status + '. Silakan muat ulang atau kembali ke dashboard.</p>' +
                        '<div class="flex items-center justify-center gap-3 pt-2">' +
                        '<button onclick="window.location.reload()" class="px-4 py-2 bg-orange-600 hover:bg-orange-700 text-white rounded-xl text-xs font-bold transition shadow-lg">' +
                        '<i class="fas fa-sync-alt mr-1.5"></i> Muat Ulang</button>' +
                        '<a href="/admin/dashboard" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-xl text-xs font-bold transition">' +
                        '<i class="fas fa-home mr-1.5"></i> Dashboard</a>' +
                        '</div></div></div>';
                }
            });

            // Tangani koneksi jaringan gagal / offline
            document.body.addEventListener('htmx:sendError', function(evt) {
                if (shell && evt.detail && evt.detail.target === shell) {
                    shell.innerHTML = '<div class="min-h-screen flex items-center justify-center bg-slate-900 text-white p-6 text-center">' +
                        '<div class="space-y-4 max-w-md bg-slate-800/90 p-8 rounded-xl border border-amber-500/40 shadow-2xl">' +
                        '<div class="w-12 h-12 rounded-2xl bg-amber-500/20 text-amber-400 flex items-center justify-center mx-auto text-xl"><i class="fas fa-wifi-slash"></i></div>' +
                        '<h2 class="text-base font-bold font-heading">Gagal Menghubungkan Jaringan</h2>' +
                        '<p class="text-xs text-slate-300">Koneksi internet Anda terputus atau server tidak dapat dijangkau.</p>' +
                        '<button onclick="window.location.reload()" class="px-4 py-2 bg-orange-600 hover:bg-orange-700 text-white rounded-xl text-xs font-bold transition shadow-lg">' +
                        '<i class="fas fa-sync-alt mr-1.5"></i> Coba Lagi</button>' +
                        '</div></div>';
                }
            });

            // Timeout toleran 15 detik untuk jaringan lambat
            setTimeout(function() {
                if (shell && shell.querySelector('.animate-spin')) {
                    shell.innerHTML = '<div class="min-h-screen flex items-center justify-center bg-slate-900 text-white p-6 text-center">' +
                        '<div class="space-y-4 max-w-md bg-slate-800/90 p-8 rounded-xl border border-orange-500/40 shadow-2xl">' +
                        '<div class="w-12 h-12 rounded-2xl bg-orange-500/20 text-orange-400 flex items-center justify-center mx-auto text-xl"><i class="fas fa-satellite-dish"></i></div>' +
                        '<h2 class="text-base font-bold font-heading">Koneksi Membutuhkan Waktu Lebih Lama</h2>' +
                        '<p class="text-xs text-slate-300">Halaman membutuhkan waktu lebih lama untuk dimuat. Silakan klik tombol di bawah untuk memuat ulang:</p>' +
                        '<div class="flex items-center justify-center gap-3 pt-2">' +
                        '<button onclick="window.location.reload()" class="px-4 py-2 bg-orange-600 hover:bg-orange-700 text-white rounded-xl text-xs font-bold transition shadow-lg">' +
                        '<i class="fas fa-sync-alt mr-1.5"></i> Muat Ulang</button>' +
                        '<a href="/admin/dashboard" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-xl text-xs font-bold transition">' +
                        '<i class="fas fa-home mr-1.5"></i> Dashboard</a>' +
                        '</div></div></div>';
                }
            }, 15000);
        })();
    </script>
</body>
</html>
